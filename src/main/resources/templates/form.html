<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dodaj Studenta</title>


    <style>
        .form-container {
            max-width: 400px;
            margin: auto;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            cursor: pointer;
        }
        .save-button {
            background-color: #4CAF50;
            color: white;
        }
        .cancel-button {
            background-color: #f44336;
            color: white;
        }
    </style>


</head>
<body>
<h1>Dodaj Studenta</h1>

<form action="#" th:action="@{/form}" th:object="${student}" method="post">
    <label for="firstName">Imię:</label>
    <input type="text" id="firstName" th:field="*{firstName}">
    <span style="color: red;" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Błąd</span>
    <br>

    <label for="lastName">Nazwisko:</label>
    <input type="text" id="lastName" th:field="*{lastName}">
    <span style="color: red;" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Błąd</span>
    <br>

    <label for="email">Email:</label>
    <input type="text" id="email" th:field="*{email}">
    <span style="color: red;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Błąd</span>
    <br>

    <button type="submit">Zapisz</button>
</form>
<button onclick="window.location.href='/menu'">Powrót do menu</button>


</body>
</html>
